services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dentalpro
      POSTGRES_USER: dentalpro
      POSTGRES_PASSWORD: dentalpro
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on: [postgres, redis]
    ports:
      - "4000:4000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend]
    ports:
      - "80:80"

volumes:
  pg_data:
